name: Run data crawler

on:
  workflow_dispatch:
    inputs:
      max:
        description: '每个关键词最多采集的论文数'
        required: false
        default: '10'
        type: string
      keywords:
        description: '逗号分隔关键词；留空使用默认关键词'
        required: false
        default: ''
        type: string
      domain:
        description: '目标领域（中文枚举：人工智能/量子计算/生物医药/具身智能/核聚变/新能源）；留空默认人工智能'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: talent-graph-db-write
  cancel-in-progress: false
  queue: max

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check required database secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::GitHub Actions Secret SUPABASE_DB_URL is missing"
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            postgresql://*|postgresql+psycopg://*) ;;
            *)
              echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection string"
              exit 1
              ;;
          esac
      - name: Install crawler dependencies
        run: python -m pip install -r tools/data_pipeline/requirements.txt
      - name: Import public research data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PYTHONPATH: tools:tools/data_pipeline:tools/crawler_backend
        run: |
          ARGS=(--max "${{ inputs.max }}" --keywords "${{ inputs.keywords }}")
          if [ -n "${{ inputs.domain }}" ]; then
            ARGS+=(--domain "${{ inputs.domain }}")
          fi
          python -m data_pipeline.scripts.initial_import "${ARGS[@]}"
