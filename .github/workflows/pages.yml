name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: frontend
      - run: pip install -r tools/migration/requirements.txt
      - run: python -m pytest tools/tests tools/migration/tests -q
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://quxnrprjefqrhgjxtpgp.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nsA2eeGHBahrGijxehyWNg_IuYFVSmV
      - run: npm test
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: python tools/repo_guard.py --repo . --tracked --artifact frontend/out
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/out

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-functions:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
      - run: supabase functions deploy manage-member --project-ref quxnrprjefqrhgjxtpgp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: supabase functions deploy translate-content --project-ref quxnrprjefqrhgjxtpgp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: supabase functions deploy trigger-crawler --project-ref quxnrprjefqrhgjxtpgp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
